<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#19191A" />
    <title>VisionForge VR training</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root { --bg:#19191A; --panel:#212223ee; --ink:#EDF1EC; --ink-2:#C1CBC3; --muted:#8B978F; --line:rgba(237,241,236,.14); --accent:#4CAE9F; --gold:#D9A94A; --red:#ef6a5e; }
      * { box-sizing:border-box; }
      html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.5 'IBM Plex Sans', system-ui, sans-serif; overflow:hidden; }
      canvas#scene { display:block; height:100vh; touch-action:none; width:100vw; }
      .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; box-shadow:0 10px 30px rgba(0,0,0,.45); }
      .top { left:16px; max-width:min(440px, calc(100vw - 32px)); padding:16px 18px; position:fixed; top:16px; }
      .top h1 { font:600 1.25rem 'Fraunces', Georgia, serif; margin:0; }
      .top h1 em { color:var(--accent); font-style:normal; }
      .meta { color:var(--ink-2); font-size:12.5px; margin:4px 0 12px; }
      .row { align-items:center; display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
      label { color:var(--ink-2); font-size:12.5px; }
      select { background:#2a2b2c; border:1px solid var(--line); border-radius:8px; color:var(--ink); font:inherit; padding:6px 8px; }
      button, .link { background:#2a2b2c; border:1px solid var(--line); border-radius:999px; color:var(--ink); cursor:pointer; font:600 12.5px 'IBM Plex Sans', sans-serif; padding:8px 14px; text-decoration:none; }
      button.primary { background:var(--accent); border-color:var(--accent); color:#061412; }
      button:disabled { cursor:not-allowed; opacity:.5; }
      button:focus-visible, select:focus-visible, .link:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
      .hint { color:var(--muted); font-size:11.5px; margin:10px 0 0; }
      .status { bottom:16px; left:50%; max-width:calc(100vw - 32px); padding:10px 16px; position:fixed; text-align:center; transform:translateX(-50%); width:640px; }
      .status strong { display:block; font-size:15px; }
      .status span { color:var(--ink-2); font-size:12.5px; }
      .status.error strong { color:var(--red); }
      .status.good strong { color:var(--accent); }
      .blocker { align-items:center; background:#000c; display:flex; inset:0; justify-content:center; padding:16px; position:fixed; }
      .blocker .panel { max-width:460px; padding:22px; }
      .blocker h2 { font:600 1.2rem 'Fraunces', Georgia, serif; margin:0 0 8px; }
      .results { max-height:calc(100vh - 32px); overflow:auto; padding:20px; position:fixed; right:16px; top:16px; width:min(420px, calc(100vw - 32px)); }
      .results h2 { font:600 1.15rem 'Fraunces', Georgia, serif; margin:0; }
      .verdict { font:600 12px 'IBM Plex Mono', monospace; letter-spacing:.06em; margin:4px 0 12px; }
      .verdict.pass { color:var(--accent); } .verdict.fail { color:var(--red); }
      table { border-collapse:collapse; font-size:12px; width:100%; }
      th { color:var(--muted); font:500 10px 'IBM Plex Mono', monospace; letter-spacing:.05em; padding:6px 4px; text-align:left; }
      td { border-top:1px solid var(--line); font-family:'IBM Plex Mono', monospace; padding:6px 4px; }
      td:first-child { font-family:'IBM Plex Sans', sans-serif; }
      td.over { color:var(--gold); } td.bad { color:var(--red); }
      /* While training, the settings collapse so the bench stays clear. */
      body.training .top .setting, body.training .hint { display:none; }
      body.training .top { padding:10px 14px; }
      body.training .meta { margin-bottom:0; }
      [hidden] { display:none !important; }
      @media (max-width: 640px) { .results { left:16px; right:auto; top:auto; bottom:90px; max-height:50vh; } }
    </style>
    <script type="importmap">{ "imports": { "three": "./vendor/three/three.module.min.js" } }</script>
  </head>
  <body>
    <canvas id="scene" aria-label="Virtual workstation for assembly training"></canvas>

    <section class="panel top" aria-labelledby="vrTitle">
      <h1 id="vrTitle">Vision<em>Forge</em> VR training</h1>
      <p class="meta" id="vrMeta">Loading the recipe…</p>
      <div class="row setting">
        <label for="vrMode">Mode</label>
        <select id="vrMode">
          <option value="guided">Guided · highlights and pick-to-light on</option>
          <option value="assessment">Assessment · no highlights</option>
        </select>
      </div>
      <div class="row setting"><label><input type="checkbox" id="vrRework" checked /> End with a rework scenario (simulated FAIL)</label></div>
      <div class="row">
        <button type="button" class="primary" id="vrStart">Start training</button>
        <button type="button" id="vrEnter" hidden>Enter VR</button>
        <a class="link" href="index.html#guide">Back to console</a>
      </div>
      <p class="hint" id="vrHint">Click a bin to pick, click the marked area to place, and hold the mouse button on an area for tool steps. In a headset, point and pull the trigger (or pinch).</p>
    </section>

    <div class="panel status" id="vrStatus" role="status" aria-live="polite"><strong>Ready</strong><span>Start training to begin.</span></div>

    <section class="panel results" id="vrResults" hidden aria-labelledby="resultsTitle"></section>

    <div class="blocker" id="vrBlocker" hidden><div class="panel"><h2 id="blockerTitle"></h2><p id="blockerText"></p><a class="link" href="index.html">Open the console</a></div></div>

    <script type="module" src="vr-training.js"></script>
  </body>
</html>
